<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skills · AgentGlim</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{background:#0b0c0e;color:#e9ebee;font:15px/1.6 system-ui;margin:0}main{max-width:1100px;margin:auto;padding:24px}a{color:#5fb8ff}input{font:inherit;background:#171a1f;color:inherit;border:1px solid #424751;padding:8px;width:100%;border-radius:6px}article{padding:16px 0;border-bottom:1px solid #23272e}h1{font-size:24px}h2{font-size:17px;margin:0}p{margin:5px 0;color:#b3bac4}code{overflow-wrap:anywhere}.tag{color:#2fd69c}:focus-visible{outline:2px solid #8f8bf0;outline-offset:3px}</style></head><body><main><a href="/">AgentGlim</a> · <a href="/setup#addons">Optional add-ons</a><h1>Skills on this machine</h1><p>Read-only inventory. Bundled skills are generic project helpers. Your personal skill libraries stay on this machine.</p><label for="search">Filter by name, harness, description or path</label><input id="search" type="search"><p id="status" role="status">Scanning…</p><div id="list"></div></main><script>
const esc=s=>String(s || '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let skills=[];
function draw(){const q=document.getElementById('search').value.toLowerCase();const visible=skills.filter(s=>JSON.stringify(s).toLowerCase().includes(q));document.getElementById('status').textContent=`${visible.length} skills · ${skills.filter(s=>s.bundled).length} bundled`;document.getElementById('list').innerHTML=visible.map(s=>`<article><h2>${esc(s.name)} ${s.bundled ? '<span class="tag">bundled</span>':''}</h2><p>${esc(s.description)}</p><p>${esc(s.harness.join(' · '))} · <code>${esc(s.path)}</code></p></article>`).join('') || '<p>No matching skills.</p>';}
document.getElementById('search').oninput=draw;fetch('/api/skills').then(r=>{if(!r.ok)throw new Error();return r.json();}).then(j=>{skills=j.skills;draw();}).catch(()=>document.getElementById('status').textContent='Could not scan skills. Reload to retry.');
</script></body></html>
