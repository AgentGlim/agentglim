name: AgentGlim desktop release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: macos-latest
            bundles: dmg
          - os: windows-latest
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/desktop/target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.12.4 --locked
      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tauriScript: cargo tauri
          args: --bundles ${{ matrix.bundles }} -- --locked
          tagName: ${{ github.ref_name }}
          releaseName: AgentGlim ${{ github.ref_name }}
          releaseBody: 'AgentGlim desktop installers. Requires a separate installation of Node.js 22 or newer.'
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
