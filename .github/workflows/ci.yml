name: CI

# Runs on every pull request and every push to main. Branch protection on main requires these checks to pass.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  privacy:
    name: privacy and leak scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: privacy-check (home paths, keys, emails, private files)
        run: node dev/privacy-check.mjs
      - name: leak-scan of every tracked file
        run: |
          git ls-files > "$RUNNER_TEMP/list.txt"
          node dev/leak-scan.mjs . --public "$RUNNER_TEMP/list.txt" --env /dev/null

  tests:
    name: tests (${{ matrix.os }}, Node ${{ matrix.node }}, Python ${{ matrix.python }})
    needs: privacy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['22.13.0', '22.x', '24.x']
        python: ['3.11', '3.12', '3.13', '3.14', '3.15-dev']
        include:
          - os: macos-latest
            node: '22.13.0'
            python: '3.11'
          - os: macos-latest
            node: '24.x'
            python: '3.15-dev'
          - os: windows-latest
            node: '22.13.0'
            python: '3.11'
          - os: windows-latest
            node: '24.x'
            python: '3.15-dev'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: python version
        run: python --version
      - name: syntax check
        run: for f in app/*.mjs dev/*.mjs; do node --check "$f"; done
      - name: unit tests
        run: npm test
      # Removed or changed Python APIs surface here first, before a macOS-only run finds them.
      - name: unit tests (Python deprecations are errors, Linux only)
        if: runner.os == 'Linux'
        run: PYTHONWARNINGS=error::DeprecationWarning npm test
