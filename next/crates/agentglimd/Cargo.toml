[package]
name = "agentglimd"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "AgentGlim daemon: local observatory for coding agents"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
sha2 = "0.10"
rand = "0.8"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking"] }
